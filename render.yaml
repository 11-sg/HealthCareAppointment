services:
  # ============================================================================
  # 1. Backend Web Service
  # ============================================================================
  - type: web
    name: careflow-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # ============================================================================
  # 2. Frontend Static Site
  # ============================================================================
  - type: web
    name: careflow-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: careflow-backend
          property: host
